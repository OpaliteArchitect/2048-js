<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" type="text/css" href="styles.css" />
        <script type="module" src="./js/controller.js" defer></script>
        <title>2048</title>
    </head>
    <body>
        <main>
            <div class="game-container">
                <div class="scores-container">
                    <p class="score-text">
                        Score: <span class="score">0</span>
                    </p>
                    <p class="high-score-text">
                        High score: <span class="high-score">0</span>
                    </p>
                </div>
                <button class="restart">Restart</button>
                <p class="status-message"></p>
                <div class="board-container">
                    <div class="cell"></div>
                    <div class="cell"></div>
                    <div class="cell"></div>
                    <div class="cell"></div>
                    <div class="cell"></div>
                    <div class="cell"></div>
                    <div class="cell"></div>
                    <div class="cell"></div>
                    <div class="cell"></div>
                    <div class="cell"></div>
                    <div class="cell"></div>
                    <div class="cell"></div>
                    <div class="cell"></div>
                    <div class="cell"></div>
                    <div class="cell"></div>
                    <div class="cell"></div>
                </div>
                <div class="arrows-container">
                    <button class="arrow up" data-direction="up">UP</button>
                    <button class="arrow left" data-direction="left">
                        LEFT
                    </button>
                    <button class="arrow right" data-direction="right">
                        RIGHT
                    </button>
                    <button class="arrow down" data-direction="down">
                        DOWN
                    </button>
                </div>
            </div>
        </main>
    </body>
</html>
